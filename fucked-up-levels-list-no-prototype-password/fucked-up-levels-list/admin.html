<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F.U.L.L. Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body">
  <header class="site-header"><div class="brand"><img src="logo.png" alt="F.U.L.L. logo" /><span>F.U.L.L. Admin</span></div><a class="admin-link" href="index.html">View List</a></header>
  <main class="admin-main">
    <div id="login" class="panel login-panel">
      <h1>Admin Access</h1><p>Only the list owner should use this page.</p>
      <input id="password" type="password" placeholder="Admin password" />
      <button id="loginBtn" class="primary">Enter</button>
    </div>

    <div id="dashboard" hidden>
      <div class="admin-top"><div><h1>Manage Levels</h1><p>Add levels, place them at any rank, and attach their GMD files.</p></div><button id="logout" class="secondary">Log out</button></div>
      <form id="levelForm" class="panel form-grid">
        <input type="hidden" id="editId" />
        <label>Level name<input id="name" required maxlength="80" placeholder="Miss Massacre" /></label>
        <label>Creator<input id="creator" required maxlength="60" placeholder="crmsnn" /></label>
        <label>Rank / position<input id="rank" required type="number" min="1" step="1" placeholder="1" /></label>
        <label>Banner image<div class="banner-upload"><img src="full-banner-logo.png" alt="F.U.L.L. banner image example" /><input id="banner" type="file" accept="image/*" /></div></label>
        <label>GMD file<input id="gmd" type="file" accept=".gmd" required /></label>
        <div class="form-actions"><button class="primary" type="submit" id="saveBtn">Add Level</button><button class="secondary" type="button" id="cancelBtn" hidden>Cancel Edit</button></div>
      </form>

      <div class="panel"><div class="panel-heading"><h2>Current List</h2><button id="clearAll" class="danger">Clear All</button></div><div id="adminList" class="admin-list"></div></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
